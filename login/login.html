<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modish Login Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>
        <span class="highlight-letter">M</span>odish 
        <span class="highlight-letter">L</span>ogin 
        <span class="highlight-letter">F</span>orm
    </h1>
    <form class="login-box">
        <div class="login-title">
            Login Here
            <i class="fa fa-hand-o-down login-icon"></i>
        </div>
        <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="red">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 
                1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 
                4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <input type="email" placeholder="Email">
        </div>
        <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24">
                <rect x="5" y="10" width="14" height="10" rx="2" fill="red"/>
                <path d="M12 10V6a4 4 0 1 1 8 0"
                    fill="none"
                    stroke="red"
                    stroke-width="3"
                    stroke-linecap="round"/>
            </svg>
            <input type="password" placeholder="Password">
        </div>
        <button type="submit" class="submit-btn">
            <svg class="submit-icon" viewBox="0 0 64 64">
                <line x1="5" y1="32" x2="35" y2="32" stroke="red" stroke-width="6" stroke-linecap="round"/>
                    <polyline points="25,22 35,32 25,42" 
                    fill="none" 
                    stroke="red" 
                    stroke-width="6" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"/>
                    <polyline points="45,10 58,10 58,54 45,54" 
                    fill="none" 
                    stroke="red" 
                    stroke-width="5" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"/>
            </svg>
        </button>
    </form>
    <div class="footer">
        © 2026 Modish Login Form. All rights reserved | Designed by 
        <span class="highlight-letter">W3layouts</span>
    </div>
</body>
</html>
