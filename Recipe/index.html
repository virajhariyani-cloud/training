<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeApp | Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen font-sans bg-gray-50">
<header class="bg-black/80 backdrop-blur-md fixed w-full z-50 shadow-lg">
  <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center text-white">
    <h1 class="text-2xl font-bold tracking-wide text-orange-400">
      🍴 RecipeApp
    </h1>
    <ul class="hidden md:flex space-x-8 font-medium">
      <li><a href="index.html" class="hover:text-orange-400 transition">Home</a></li>
      <li><a href="about.html" class="hover:text-orange-400 transition">About</a></li>
      <li><a href="recipe.html" class="hover:text-orange-400 transition">Recipe</a></li>
    </ul>
    <button id="menu-btn" class="md:hidden focus:outline-none">
      ☰

  <div id="mobile-menu" class="hidden md:hidden bg-black/90 text-white px-6 pb-4">
    <ul class="space-y-4 font-medium">
      <li><a href="home.html" class="block hover:text-orange-400">Home</a></li>
      <li><a href="about.html" class="block hover:text-orange-400">About</a></li>
      <li><a href="recipe.html" class="block hover:text-orange-400">Recipe</a></li>
    </ul>
  </div>
</header>
<section 
  class="h-screen bg-cover bg-center relative flex items-center justify-center"
  style="background-image: url('asset/food-with-ingredients.jpg');">
  <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/60 to-black/80"></div>
  <div class="relative max-w-4xl text-center px-6">
    <h1 class="text-white text-4xl sm:text-5xl md:text-6xl font-extrabold leading-tight mb-6">
      Welcome to <span class="text-orange-400">Recipe World</span>

      A modern recipe manager designed for food lovers.
    </p>
    <a href="recipe.html"
       class="inline-block bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-full text-lg font-semibold transition transform hover:scale-105 shadow-lg">

    </a>
  </div>
</section>
<footer class="bg-black text-gray-400 text-center py-4 text-sm">
  © 2026 RecipeApp. All rights reserved.
</footer>
<script>
  const btn = document.getElementById("menu-btn");
  const menu = document.getElementById("mobile-menu");
  btn.addEventListener("click", () => {
    menu.classList.toggle("hidden");
  });
</script>
</body>
</html>
