<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>Registration Form</title>
</head>
<body class="flex items-center justify-center">
  <div class="h-screen bg-white flex items-center justify-center">
    <div class="p-15 bg-linear-to-r from-blue-400 to-blue-200">
      <form class="w-full max-w-4xl rounded-xl shadow-2xl overflow-hidden bg-white 
               flex flex-col md:flex-row">
        <div class="w-full md:w-1/2 p-10 bg-gray-100 flex flex-col justify-between">
          <div>
            <h2 class="text-indigo-600 text-2xl font-semibold mb-8">
              General Information
            </h2>
            <div class="space-y-5">
              <select class="w-full h-11 border rounded px-3 text-gray-600">
                <option value="Title">Title</option>
                <option value="MR.">Mr.</option>
                <option value="MS.">Ms.</option>
                <option value="MRS.">Mrs.</option>
              </select>
              <div class="flex flex-col md:flex-row gap-4">
                <input type="text" placeholder="First name"
                  class="w-full h-11 border rounded px-3">
                <input type="text" placeholder="Last name"
                  class="w-full h-11 border rounded px-3">
              </div>
              <select class="w-full h-11 border rounded px-3 text-gray-600">
                <option value="position">Position</option>
                <option value="CEO">CEO</option>
                <option value="CTO">CTO</option>
                <option value="CFO">CFO</option>
              </select>
              <input type="text" placeholder="Position"
                class="w-full h-11 border rounded px-3">
              <div class="flex flex-col md:flex-row gap-4">
                <input type="text" placeholder="Business Arena"
                  class="w-full h-11 border rounded px-3">
                <select class="w-full h-11 border rounded px-3 text-gray-600">
                  <option>Employees</option>
                  <option value="1-10">1-10</option>
                  <option value="11-50">11-50</option>
                  <option value="51-200">51-200</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="w-full md:w-1/2 p-10 bg-blue-600 text-white flex flex-col justify-between">      
          <div>
            <h2 class="text-2xl font-semibold mb-8">
              Contact Details
            </h2>
            <div class="space-y-5">
              <input type="text" placeholder="Street + Nr"
                class="w-full h-11 rounded px-3 bg-transparent border border-white placeholder-white">
              <input type="text" placeholder="Additional Information"
                class="w-full h-11 rounded px-3 bg-transparent border border-white placeholder-white">
              <div class="flex flex-col md:flex-row gap-4">
                <input type="text" placeholder="Zip Code"
                  class="w-full h-11 rounded px-3 bg-transparent border border-white placeholder-white">
                <input type="text" placeholder="Place"
                  class="w-full h-11 rounded px-3 bg-transparent border border-white placeholder-white">
              </div>
              <input type="text" placeholder="Country"
                class="w-full h-11 rounded px-3 bg-transparent border border-white placeholder-white">
              <div class="flex flex-col md:flex-row gap-4">
                <input type="text" placeholder="Code +"
                  class="w-full md:w-1/3 h-11 rounded px-3 bg-transparent border border-white placeholder-white">
                <input type="text" placeholder="Phone Number"
                  class="w-full md:w-2/3 h-11 rounded px-3 bg-transparent border border-white placeholder-white">
              </div>
              <input type="email" placeholder="Your Email"
                class="w-full h-11 rounded px-3 bg-transparent border border-white placeholder-white">
              <div class="flex items-start gap-2 text-sm mt-3">
                <input type="checkbox" class="mt-1">
                <p>
                  I do accept the 
                  <span class="underline cursor-pointer">
                    Terms and Conditions
                  </span>
                  of your site.
                </p>
              </div>
              <button type="submit"
                class="mt-6 bg-white text-indigo-700 font-semibold px-6 py-2 rounded-lg shadow-md hover:bg-gray-100 transition w-full md:w-auto">
                REGISTER
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
